<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Listagem — Clínica Veterinária</title>
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>
  <header class="topo">
    <h1>🐾 Clínica Veterinária</h1>
    <div class="usuario-info">
      <span id="nomeUsuarioLogado"></span>
      <button id="btnSair">Sair</button>
    </div>
  </header>

  <main>
    <a href="painel.html" class="voltar">&larr; Voltar ao painel</a>

    <div class="card">
      <div class="topo-pagina">
        <h2 id="tituloPagina">Listagem</h2>
        <a id="linkCadastrar" class="botao pequeno" href="#">+ Novo</a>
      </div>
      <p id="descricaoPagina"></p>

      <p class="carregando" id="statusCarregamento">Carregando registros...</p>

      <div style="overflow-x:auto">
        <table id="tabelaRegistros" style="display:none">
          <thead>
            <tr id="linhaCabecalho"></tr>
          </thead>
          <tbody id="corpoTabela"></tbody>
        </table>
      </div>

      <div id="mensagem" class="mensagem"></div>
    </div>
  </main>

  <!-- Modal de edição -->
  <div class="overlay" id="overlayEdicao">
    <div class="card">
      <h2>Editar registro</h2>
      <form id="formEdicao"></form>
      <div id="mensagemEdicao" class="mensagem"></div>
      <div class="rodape-form">
        <button type="button" class="botao" id="btnSalvarEdicao">Salvar alterações</button>
        <button type="button" class="botao secundario" id="btnCancelarEdicao">Cancelar</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/listar.js"></script>
</body>

</html>
